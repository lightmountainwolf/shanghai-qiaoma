<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f2820">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>上海敲麻</title>
<style>
  :root {
    --felt: #1d825f;
    --gold: #e3c07a;
    --gold-dim: #9a7c48;
    --text: #f4ecda;
    --text-dim: #b9ae94;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: radial-gradient(120% 90% at 50% 0%, #123f31 0%, #0a211a 62%, #061410 100%);
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    height: 100%;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    touch-action: manipulation;
  }

  #app {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    max-width: 760px;
    margin: 0 auto;
    width: 100%;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    padding: calc(var(--safe-t) + 6px) 10px 6px;
    flex-shrink: 0;
  }
  h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 1px;
    color: var(--gold);
    white-space: nowrap;
  }
  .scores { display: flex; gap: 5px; flex: 1; justify-content: flex-end; }
  /* 座位小卡：头像色点 + 昵称 + 分数（JJ 顶部信息条风格） */
  .score-box {
    background: linear-gradient(180deg, rgba(10,48,36,.85), rgba(6,30,22,.85));
    border: 1px solid rgba(227,192,122,.45);
    border-radius: 9px;
    padding: 3px 7px 3px 5px;
    font-size: 11px;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: border-color .2s, box-shadow .2s, background .2s;
  }
  .score-box .seat-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 0 4px rgba(0,0,0,.5) inset;
  }
  .score-box .score-txt { min-width: 0; text-align: left; }
  .score-box .name {
    color: var(--text-dim);
    font-size: 9.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .score-box .val {
    font-size: 14px;
    font-weight: 600;
    color: var(--gold);
    line-height: 1.25;
  }
  .score-box.turn {
    border-color: var(--gold);
    box-shadow: 0 0 10px rgba(227,192,122,.45);
    background: linear-gradient(180deg, rgba(120,88,30,.42), rgba(60,44,16,.42));
  }

  #canvas-wrap {
    flex: 1;
    min-height: 0;
    margin: 0 8px;
    border: 2px solid rgba(227,192,122,.62);
    border-radius: 14px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 18px rgba(227,192,122,.18), 0 8px 22px rgba(0,0,0,.35);
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    /* 棋盘自己处理按下/松手出牌，交给浏览器会抢走手势 */
    touch-action: none;
  }

  #actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    padding: 8px 10px 4px;
    flex-shrink: 0;
    min-height: 0;
  }
  /* 操作按钮：JJ 麻将同款金色圆角大按钮（主字 + 小字） */
  button {
    background:
      linear-gradient(180deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 46%),
      linear-gradient(180deg, #ffe9b0 0%, #e9bf62 48%, #cf9a41 100%);
    color: #4a2f0c;
    border: 2px solid rgba(255,246,208,.72);
    border-radius: 18px;
    padding: 0 16px;
    min-width: 70px;
    height: 58px;
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    cursor: pointer;
    box-shadow: 0 4px 0 #8a5f22, 0 6px 14px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.65);
    transition: transform .06s, box-shadow .06s, opacity .15s;
    font-family: inherit;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    animation: popIn .18s ease-out;
  }
  button .ico {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: 1px;
  }
  button .sub {
    font-size: 10.5px;
    font-weight: 500;
    opacity: .72;
    line-height: 1.15;
    max-width: 96px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  button:active:not(:disabled) {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #8a5f22, 0 2px 5px rgba(0,0,0,.25);
  }
  button:disabled { opacity: .35; cursor: not-allowed; }
  /* 过 / 不胡：深青绿，和主操作区分开 */
  button.secondary {
    background:
      linear-gradient(180deg, rgba(255,255,255,.30) 0%, rgba(255,255,255,0) 46%),
      linear-gradient(180deg, #49a184 0%, #2f7d64 55%, #235f4c 100%);
    color: #eafff6;
    border-color: rgba(190,240,215,.6);
    box-shadow: 0 4px 0 #17493a, 0 6px 14px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.35);
  }
  button.secondary .sub { opacity: .85; }
  /* 「再来一局」这类文字较长的按钮 */
  button.wide { min-width: 132px; border-radius: 16px; }
  button.wide .ico { font-size: 15px; letter-spacing: 1px; }

  /* 敲：金色 + 呼吸高亮，确保一眼能看到 */
  button.primary {
    background:
      linear-gradient(180deg, rgba(255,255,255,.65) 0%, rgba(255,255,255,0) 46%),
      linear-gradient(180deg, #fff0be 0%, #f0c968 48%, #d89a3a 100%);
    color: #4a3510;
    box-shadow: 0 4px 0 #a8802f, 0 0 16px rgba(240,201,104,.5), inset 0 1px 0 rgba(255,255,255,.7);
    min-width: 82px;
    animation: popIn .18s ease-out, pulse 1.6s ease-in-out infinite;
  }
  button.primary .ico { font-size: 23px; }
  button.primary .sub { font-size: 11px; opacity: .8; max-width: 110px; }
  /* 胡：红金配色，全场最显眼 */
  button.win {
    background:
      linear-gradient(180deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 46%),
      linear-gradient(180deg, #ffb37a 0%, #ec5a3e 52%, #c8361f 100%);
    color: #fff8e8;
    border-color: #ffdca8;
    box-shadow: 0 4px 0 #8d2a1a, 0 0 18px rgba(236,90,62,.55), inset 0 1px 0 rgba(255,255,255,.45);
    min-width: 82px;
    animation: popIn .18s ease-out, pulseWin 1.5s ease-in-out infinite;
  }
  button.win .ico { font-size: 24px; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 4px 0 #a8802f, 0 0 10px rgba(240,201,104,.35), inset 0 1px 0 rgba(255,255,255,.7); }
    50% { box-shadow: 0 4px 0 #a8802f, 0 0 22px rgba(240,201,104,.75), inset 0 1px 0 rgba(255,255,255,.7); }
  }
  @keyframes pulseWin {
    0%, 100% { box-shadow: 0 4px 0 #8d2a1a, 0 0 10px rgba(236,90,62,.35), inset 0 1px 0 rgba(255,255,255,.45); }
    50% { box-shadow: 0 4px 0 #8d2a1a, 0 0 24px rgba(236,90,62,.8), inset 0 1px 0 rgba(255,255,255,.45); }
  }
  @keyframes popIn {
    from { transform: scale(.86); opacity: .45; }
    to { transform: scale(1); opacity: 1; }
  }

  #hint {
    text-align: center;
    color: var(--gold);
    font-size: 12px;
    opacity: .92;
    padding: 0 10px 4px;
    flex-shrink: 0;
    min-height: 16px;
  }

  #log {
    margin: 0 8px calc(var(--safe-b) + 6px);
    background: rgba(0,0,0,.32);
    border-radius: 8px;
    padding: 6px 10px;
    height: 62px;
    overflow-y: auto;
    font-size: 11px;
    line-height: 1.6;
    color: var(--text-dim);
    flex-shrink: 0;
    -webkit-overflow-scrolling: touch;
  }
  #log div { animation: fadeIn .25s ease; }
  #log .hi { color: var(--gold); font-weight: 600; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  #result {
    position: absolute;
    inset: 0;
    display: none;
    background: rgba(8,20,16,.94);
    border-radius: 10px;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: var(--gold);
    gap: 12px;
    text-align: center;
    padding: 16px;
    overflow-y: auto;
  }
  #result.show { display: flex; }
  #result .detail { font-size: 12px; color: var(--text-dim); line-height: 1.8; }

  /* 横屏时压缩纵向空间 */
  @media (orientation: landscape) and (max-height: 500px) {
    header { padding-top: calc(var(--safe-t) + 3px); padding-bottom: 3px; }
    h1 { font-size: 13px; }
    .score-box .val { font-size: 12px; }
    #log { height: 40px; font-size: 10px; line-height: 1.5; }
    button { height: 42px; min-width: 56px; padding: 0 12px; }
    button .ico { font-size: 16px; }
    button .sub { font-size: 9.5px; }
    #hint { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>上海敲麻</h1>
    <div class="scores" id="scores"></div>
  </header>
  <div id="canvas-wrap">
    <canvas id="board"></canvas>
    <div id="result"></div>
  </div>
  <div id="hint"></div>
  <div id="actions"></div>
  <div id="log"></div>
</div>
<script type="module" src="./dist/src/ui/main.js"></script>
</body>
</html>
